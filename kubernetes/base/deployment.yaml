apiVersion: apps/v1
kind: Deployment
metadata:
  name: biglernet-website
  labels:
    app: biglernet-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: biglernet-website
  template:
    metadata:
      labels:
        app: biglernet-website
    spec:
      containers:
        - name: website
          image: ghcr.io/biglernet/biglernet-homepage:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      restartPolicy: Always
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
