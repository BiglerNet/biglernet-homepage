name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/BiglerNet.Website/BiglerNet.Website.csproj

      - name: Build
        run: dotnet build src/BiglerNet.Website/BiglerNet.Website.csproj --no-restore -c Release

      - name: Docker build (sanity check only, not pushed)
        run: docker build -t biglernet-homepage:ci .
